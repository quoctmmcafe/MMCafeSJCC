<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Image Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header Navigation -->
    <header class="w-full max-w-4xl mx-auto px-4 py-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 flex items-center justify-center font-bold">
                <i class="fa-regular fa-image"></i>
            </div>
            <span class="font-bold text-lg tracking-tight text-gray-900 dark:text-white">ImageViewer</span>
        </div>
        <button id="themeToggleBtn" onclick="toggleDarkMode()" class="p-2 rounded-lg text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800 transition">
            <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
        </button>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 pb-12 flex flex-col items-center justify-center">
        
        <!-- Drag & Drop / Upload Container -->
        <div 
            id="dropZone" 
            class="w-full bg-white dark:bg-gray-800 rounded-2xl border-2 border-dashed border-gray-300 dark:border-gray-700 p-6 sm:p-8 transition-all hover:border-gray-400 dark:hover:border-gray-500 flex flex-col items-center shadow-sm"
            ondragover="handleDragOver(event)"
            ondragleave="handleDragLeave(event)"
            ondrop="handleDrop(event)"
        >
            <!-- Image Display Area -->
            <div class="w-full flex items-center justify-center overflow-hidden rounded-xl bg-gray-50 dark:bg-gray-950/50 min-h-[300px] max-h-[500px] border border-gray-100 dark:border-gray-800 relative group">
                <img 
                    id="imageDisplay" 
                    src="https://placehold.co/1200x800/2a2d34/ffffff?text=Sample+Image" 
                    alt="Loaded Content" 
                    class="max-w-full max-h-[480px] object-contain rounded-lg transition-transform duration-200"
                    onload="updateImageDetails(this)"
                    onerror="handleImageError(this)"
                />
            </div>

            <!-- Upload Controls & Drag Hint -->
            <div class="mt-6 w-full flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3 text-sm text-gray-500 dark:text-gray-400">
                    <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                    <span>Drag and drop an image or</span>
                    <label class="cursor-pointer font-medium text-blue-600 dark:text-blue-400 hover:underline">
                        browse file
                        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                    </label>
                </div>

                <!-- Load via URL Input -->
                <div class="flex w-full sm:w-auto items-center space-x-2">
                    <input 
                        type="text" 
                        id="urlInput" 
                        placeholder="Paste image URL..." 
                        class="px-3 py-1.5 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 sm:w-64"
                    />
                    <button onclick="loadImageFromUrl()" class="px-3 py-1.5 text-sm font-medium bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg hover:opacity-90 transition">
                        Load
                    </button>
                </div>
            </div>
        </div>

        <!-- Image Info & Actions Panel -->
        <div class="w-full mt-6 bg-white dark:bg-gray-800 rounded-2xl p-6 border border-gray-200 dark:border-gray-700 shadow-sm">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400 mb-4">Image Details & Actions</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 text-sm">
                <div class="p-3 bg-gray-50 dark:bg-gray-900 rounded-xl">
                    <span class="block text-xs text-gray-500 dark:text-gray-400">Filename</span>
                    <span id="fileName" class="font-medium text-gray-900 dark:text-white truncate block">Sample_Image.jpg</span>
                </div>
                <div class="p-3 bg-gray-50 dark:bg-gray-900 rounded-xl">
                    <span class="block text-xs text-gray-500 dark:text-gray-400">Dimensions</span>
                    <span id="fileDimensions" class="font-medium text-gray-900 dark:text-white block">1200 x 800 px</span>
                </div>
                <div class="p-3 bg-gray-50 dark:bg-gray-900 rounded-xl">
                    <span class="block text-xs text-gray-500 dark:text-gray-400">Approx. File Size</span>
                    <span id="fileSize" class="font-medium text-gray-900 dark:text-white block">N/A (External URL)</span>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex flex-wrap gap-3">
                <button onclick="copyImageUrl()" class="flex-1 sm:flex-none inline-flex items-center justify-center px-4 py-2 text-sm font-medium bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-xl transition">
                    <i class="fa-regular fa-copy mr-2"></i> Copy Image Source
                </button>
                <a id="downloadBtn" download="image.jpg" href="https://placehold.co/1200x800/2a2d34/ffffff?text=Sample+Image" class="flex-1 sm:flex-none inline-flex items-center justify-center px-4 py-2 text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm transition">
                    <i class="fa-solid fa-download mr-2"></i> Download Image
                </a>
            </div>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-6 right-6 bg-gray-900 text-white dark:bg-white dark:text-gray-900 text-sm font-medium px-4 py-2.5 rounded-xl shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none">
            Image source copied to clipboard!
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-gray-400">
        Minimalist Image Hosting & Viewer Template
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const imageDisplay = document.getElementById('imageDisplay');
        const fileNameEl = document.getElementById('fileName');
        const fileDimensionsEl = document.getElementById('fileDimensions');
        const fileSizeEl = document.getElementById('fileSize');
        const downloadBtn = document.getElementById('downloadBtn');
        const dropZone = document.getElementById('dropZone');

        // Dark Mode Toggle
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-moon text-lg';
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun text-lg';
            }
        }

        // Drag & Drop Handlers
        function handleDragOver(e) {
            e.preventDefault();
            dropZone.classList.add('border-blue-500', 'bg-blue-50/20');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-blue-50/20');
        }

        function handleDrop(e) {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-blue-50/20');
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                loadImageFromFile(files[0]);
            }
        }

        // File Select Handler
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                loadImageFromFile(file);
            }
        }

        // Read Local File into Display
        function loadImageFromFile(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                imageDisplay.src = event.target.result;
                downloadBtn.href = event.target.result;
                downloadBtn.download = file.name;
                
                fileNameEl.textContent = file.name;
                fileSizeEl.textContent = formatBytes(file.size);
            };
            reader.readAsDataURL(file);
        }

        // Load image from URL Input
        function loadImageFromUrl() {
            const url = document.getElementById('urlInput').value.trim();
            if (url) {
                imageDisplay.src = url;
                downloadBtn.href = url;
                downloadBtn.download = "downloaded-image";
                fileNameEl.textContent = url.split('/').pop().split('?')[0] || "external-image";
                fileSizeEl.textContent = "N/A (External URL)";
            }
        }

        // Update dimension info once image loads
        function updateImageDetails(img) {
            fileDimensionsEl.textContent = `${img.naturalWidth} x ${img.naturalHeight} px`;
        }

        // Handle Image Load Errors
        function handleImageError(img) {
            img.src = "https://placehold.co/800x600/ef4444/ffffff?text=Failed+to+Load+Image";
            fileNameEl.textContent = "Error loading image";
            fileDimensionsEl.textContent = "N/A";
            fileSizeEl.textContent = "N/A";
        }

        // Utility: Format File Sizes
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Utility: Copy URL / Data URI
        function copyImageUrl() {
            const textToCopy = imageDisplay.src;
            
            // Clipboard Fallback Strategy
            const tempInput = document.createElement("input");
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            showToast("Copied image source to clipboard!");
        }

        // Notification Helper
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
