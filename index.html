<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMCafe SJCC Menu</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            darkbg: '#121212',
          }
        }
      }
    }
  </script>

  <style>
    /* Prevent body scrolling for a modern web-app feel */
    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #121212;
    }
  </style>
</head>
<body class="bg-darkbg text-neutral-100 font-sans h-full flex flex-col antialiased selection:bg-neutral-800">

  <!-- Top Floating Controls Header -->
  <header class="fixed top-0 left-0 right-0 z-50 p-3 sm:p-4 flex items-center justify-between pointer-events-none">
    
    <!-- Title / Brand Badge -->
    <div class="pointer-events-auto bg-neutral-900/90 backdrop-blur-md px-4 py-2 rounded-full border border-neutral-800 shadow-xl flex items-center gap-2.5">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <h1 class="text-xs sm:text-sm font-semibold tracking-wide uppercase text-neutral-200">MMCafe Menu @ SJCC</h1>
    </div>

    <!-- Quick Actions Toolbar -->
    <div class="pointer-events-auto flex items-center gap-1.5 sm:gap-2 bg-neutral-900/90 backdrop-blur-md p-1.5 rounded-full border border-neutral-800 shadow-xl">
      
      <!-- Open in New Tab -->
      <a href="menu.pdf" target="_blank" title="Open PDF in New Tab" class="px-3 h-8 rounded-full hover:bg-neutral-800 flex items-center justify-center gap-1.5 text-xs text-neutral-300 transition-colors">
        <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
        <span class="hidden sm:inline">Open</span>
      </a>

      <!-- Print Button -->
      <button onclick="printPDF()" title="Print Menu" class="w-8 h-8 rounded-full hover:bg-neutral-800 flex items-center justify-center text-xs text-neutral-300 transition-colors">
        <i class="fa-solid fa-print"></i>
      </button>

      <div class="w-px h-4 bg-neutral-800 my-auto"></div>

      <!-- Download PDF Button -->
      <a href="menu.pdf" download="menu.pdf" title="Download PDF Menu" class="px-3.5 h-8 rounded-full bg-neutral-100 text-neutral-900 flex items-center justify-center gap-2 text-xs font-medium hover:bg-white transition-colors">
        <i class="fa-solid fa-download text-[11px]"></i>
        <span>Download</span>
      </a>
    </div>
  </header>

  <!-- Interactive PDF Viewport Container -->
  <main class="flex-1 w-full h-full relative pt-16 sm:pt-20 pb-4 px-2 sm:px-4 flex flex-col items-center justify-center">
    
    <!-- Embedded PDF Container -->
    <div class="w-full h-full max-w-6xl bg-neutral-900/50 rounded-2xl border border-neutral-800/80 shadow-2xl overflow-hidden relative">
      <object
        data="menu.pdf#toolbar=0&navpanes=0&scrollbar=1"
        type="application/pdf"
        class="w-full h-full border-none"
      >
        <!-- Mobile/Unsupported Browser Fallback Embed -->
        <embed 
          src="menu.pdf#toolbar=0&navpanes=0" 
          type="application/pdf" 
          class="w-full h-full border-none"
        />

        <!-- Fallback UI when PDF inline viewer is blocked or unavailable -->
        <div class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center space-y-4 bg-neutral-900">
          <div class="w-14 h-14 rounded-full bg-neutral-800 text-neutral-300 flex items-center justify-center text-xl">
            <i class="fa-solid fa-file-pdf"></i>
          </div>
          <div class="max-w-md">
            <h2 class="text-base font-semibold text-neutral-100">View Menu Document</h2>
            <p class="text-xs text-neutral-400 mt-1 leading-relaxed">
              Your browser or device does not support inline PDF previews. You can easily open or download the menu directly below.
            </p>
          </div>
          <div class="flex flex-col sm:flex-row items-center gap-2 pt-2">
            <a href="menu.pdf" target="_blank" class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-medium transition-colors flex items-center justify-center gap-2">
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              Open PDF in New Tab
            </a>
            <a href="menu.pdf" download="menu.pdf" class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-neutral-100 hover:bg-white text-neutral-900 text-xs font-medium transition-colors flex items-center justify-center gap-2">
              <i class="fa-solid fa-download text-[10px]"></i>
              Download PDF Menu
            </a>
          </div>
        </div>
      </object>
    </div>

  </main>

  <script>
    // Function to trigger PDF printing using a hidden iframe
    function printPDF() {
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = 'menu.pdf';
      document.body.appendChild(iframe);
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }
  </script>
</body>
</html>
